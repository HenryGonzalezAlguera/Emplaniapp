name: EMPLANIAPP .NET Framework build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages.config projects
        shell: pwsh
        run: nuget restore Emplaniapp.sln -NonInteractive

      - name: Build solution (Release)
        shell: pwsh
        run: msbuild Emplaniapp.sln /m /p:Configuration=Release /p:Platform="Any CPU" /p:DeployOnBuild=false /verbosity:minimal
